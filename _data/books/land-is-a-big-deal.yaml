- text: By George, capital is “wealth devoted to procuring more wealth” and it is
    the next thing he insists everyone is hopelessly confused about.
  page: KOReader page 43
  source: koreader
  chapter: Wages and Capital
  datetime: '2026-10-11 19:32:59'
  pos0: /body/DocFragment[16]/body/p[36]/text().0
  pos1: /body/DocFragment[16]/body/p[36]/span[3]/text().109
- text: 'By George, all capital is wealth, but not all wealth is capital.

    George notes capital is often described as being “stored up labor” and endorses
    this view—but what it really means, is capital is stored up production. It is
    not literally the labor that’s stored up, but the wealth generated by it, set
    aside, and then dedicated to the purpose of getting more wealth.

    George insists that it is the owner’s intention that transforms wealth into capital.
    If you buy an old factory to throw parties in for your hipster friends, it is
    just wealth. But the minute you decide to put it to work to make something useful
    (or start charging your hipster friends a cover charge at the door) it becomes
    capital.'
  page: KOReader page 44
  source: koreader
  chapter: Wages and Capital
  datetime: '2026-10-11 19:34:10'
  pos0: /body/DocFragment[16]/body/p[42]/text().0
