- text: 'By George, land is not wealth.

    And it is definitely not capital.

    The unique specialness of land is George’s entire schtick and the very core of
    his philosophy.

    The term land embraces, in short, all natural materials, forces, and opportunities.

    That means that a field or a meadow is “land,” as is a mountain. But so are the
    fish in the sea, the clouds in the sky, veins of gold in the earth’s crust, and
    the oil deep underground. These things aren’t yet wealth—not until human beings
    both a) desire them and b) touch them with labor.'
  page: KOReader page 45
  source: koreader
  chapter: Wages and Capital
  datetime: '2026-10-11 19:35:47'
  pos0: /body/DocFragment[16]/body/p[50]/text().0
  pos1: /body/DocFragment[16]/body/p[54]/span[4]/text().1
- text: The important thing to grasp about land is that it comes before everything
    humans do or make, and is itself a thing no human can make.
  page: KOReader page 47
  source: koreader
  chapter: Wages and Capital
  datetime: '2026-10-11 19:37:28'
  pos0: /body/DocFragment[16]/body/p[68]/text().0
  pos1: /body/DocFragment[16]/body/p[68]/span/text().95
- text: 'By George, we’re told that there are three factors in production: Land, Labor,
    and Capital. For each of these terms there must be a “law of distribution” that
    explains how each gets compensated for its part in production.

    The reward you get from production by owning Land is called Rent.

    The reward you get from production by supplying Labor is called Wages.

    The reward you get from production by supplying Capital is called … um, what?

    We’re looking for a term that clearly expresses the return to capital alone and
    nothing else.

    The closest thing we have is Interest, and that’s probably good enough.'
  page: KOReader page 74
  source: koreader
  chapter: The Laws of Distribution
