- text: Federal tax receipts in 2020 were $3.42 trillion, and operation costs for
    the IRS were $12.3 billion (IRS, 2021), or 0.36%. However, the IRS outsources
    most of the labor of tax preparation to the taxpayers themselves, with compliance
    costs estimated between $200 billion (Bosch & Gray, 2018) and $400 billion (Erb,
    2016) a year, to the delight of private tax preparation software companies like
    Intuit (Appelbaum, 2021). Add that up, and the total cost of federal tax collection
    to the economy is anywhere between 6-12% of the amount it raises.
