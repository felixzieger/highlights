- text: 'The common usage, both then and now, is “anything with an exchange value.”
    George doesn’t like how this mixes dissimilar things.

    By George, what is wealth?

    Wealth is produced when nature’s bounty is touched by human labor resulting in
    a tangible product that is the object of human desire.'
  page: KOReader page 37
  source: koreader
  chapter: Wages and Capital
  datetime: '2026-10-11 19:32:28'
  pos0: /body/DocFragment[16]/body/p[3]/text().0
  pos1: /body/DocFragment[16]/body/p[5]/span[4]/text().36
- text: 'And by George, money isn’t wealth.

    Articles of gold are wealth because they’re tangible things that have been dug
    up, crafted, and fulfill certain human desires. But paper currency, digital currencies,
    and other things that aren’t inherently valuable but merely represent value are
    not wealth (outside of putting their physical articles in coin collections or
    making paper airplanes, and so forth). Now don’t get the man wrong, these things
    are certainly valuable. They’re just not wealth. They are certificates that represent
    claims on wealth. For any computer programmers in the audience, money is a pointer
    to wealth.'
  page: KOReader page 40
  source: koreader
  chapter: Wages and Capital
  datetime: '2026-10-11 19:32:49'
